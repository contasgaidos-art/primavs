name: Gerar app do Mac (PRISMA)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --mac --universal -c.mac.identity=null
      - uses: actions/upload-artifact@v4
        with:
          name: PRISMA-Virtual-Sound-Mac
          path: |
            dist/*.dmg
            dist/*.zip
